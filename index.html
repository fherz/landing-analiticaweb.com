<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Dominio en Venta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <h1 id="heading">landing-analiticaweb.com está en venta</h1>
  <p id="description">Este dominio está en venta. Haz tu oferta o contáctanos para más información.</p>
  
  <form id="contactForm">
    <input type="text" id="name" placeholder="Tu nombre" required>
    <input type="email" id="email" placeholder="Tu correo electrónico" required>
    <textarea id="message" placeholder="Tu mensaje" rows="4" required></textarea>
    <button type="submit" id="submitBtn">Enviar</button>
    <p id="formMessage" class="hidden"></p>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
